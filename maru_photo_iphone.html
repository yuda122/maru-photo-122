<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ff">
<title>まるフォト</title>
<style>
:root{--blue:#477bfa;--ink:#28345a;--paper:#f7f5ff}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
header{padding:18px 18px 8px;display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:14px;background:var(--blue);color:white;display:grid;place-items:center;font-size:24px}
h1{font-size:23px;margin:0}
.sub{font-size:12px;color:#6e7690;margin-top:3px}
main{padding:8px 14px 24px;max-width:700px;margin:auto}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
button,.filebtn{border:0;border-radius:14px;padding:13px 12px;font-size:14px;font-weight:700;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:7px}
.primary{background:var(--blue);color:white}.secondary{background:white;color:var(--ink);box-shadow:0 2px 10px #1b2b5010}
#stage{width:100%;height:min(62vh,560px);min-height:340px;background:linear-gradient(145deg,#b7d5ff,#ffdce8,#ffebbd);border-radius:24px;overflow:hidden;position:relative;box-shadow:0 8px 28px #2d3e6718;touch-action:pan-y}
#stage:after{content:"";position:absolute;inset:0;pointer-events:none;border:1px solid #ffffff88;border-radius:24px}
#bgImage{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:white;font-weight:700;text-shadow:0 1px 8px #52608088;pointer-events:none}
.photo{position:absolute;border:3px solid white;border-radius:50%;overflow:hidden;box-shadow:0 5px 15px #17244445;touch-action:none;cursor:grab}
.photo img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.photo.selected{outline:3px solid var(--blue);outline-offset:3px}
.controls{background:white;border-radius:18px;padding:12px;margin-top:12px;box-shadow:0 2px 12px #1b2b5009}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.small{font-size:12px;color:#77809a;line-height:1.6;margin:10px 2px 0}
#sizeControl{width:100%;accent-color:var(--blue)}
#status{font-size:13px;min-height:18px;color:#47704b;margin-top:8px}
input[type=file]{display:none}
button:disabled{opacity:.45}
footer{text-align:center;font-size:11px;color:#8b91a6;padding:12px}
</style>
</head>
<body>
<header><div class="logo">◉</div><div><h1>まるフォト</h1><div class="sub">好きな写真を、まるく。自分だけのコラージュ。</div></div></header>
<main>
  <div class="toolbar">
    <button class="secondary" id="pickBg">🖼️ 背景を選ぶ</button>
    <button class="primary" id="pickPhotos">＋ 写真を追加</button>
    <input id="bgInput" type="file" accept="image/*">
    <input id="photosInput" type="file" accept="image/*" multiple>
  </div>
  <section id="stage" aria-label="コラージュ編集エリア">
    <img id="bgImage" alt="">
    <div class="empty" id="empty">「写真を追加」から始めよう！<br>写真をドラッグして自由に配置できるよ</div>
  </section>
  <section class="controls">
    <div class="row">
      <button class="secondary" id="smaller" disabled>− 小さく</button>
      <button class="secondary" id="bigger" disabled>＋ 大きく</button>
      <button class="secondary" id="delete" disabled>🗑 選択を削除</button>
    </div>
    <p class="small">丸い写真をタップして選択し、ドラッグして移動。大きさは下のボタンで調整できるよ。</p>
    <input id="sizeControl" type="range" min="64" max="210" value="120" aria-label="選択した写真の大きさ">
    <div class="row" style="margin-top:10px">
      <button class="secondary" id="clearBg">背景をリセット</button>
      <button class="primary" id="save" style="flex:1">⬇️ 完成画像を保存</button>
    </div>
    <div id="status" role="status"></div>
  </section>
  <p class="small">写真はこの画面内で処理し、外部サーバーには送信しません。ページを閉じると配置が消えることがあるので、完成したら画像を保存してね。</p>
</main>
<footer>まるフォト・試作版</footer>
<script>
const stage=document.getElementById('stage'), bgImage=document.getElementById('bgImage');
const bgInput=document.getElementById('bgInput'), photosInput=document.getElementById('photosInput');
const empty=document.getElementById('empty'), status=document.getElementById('status');
let items=[], selected=null, bgUrl=null, nextId=1;
function msg(s){status.textContent=s}
function readFile(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
document.getElementById('pickBg').onclick=()=>bgInput.click();
document.getElementById('pickPhotos').onclick=()=>photosInput.click();
bgInput.onchange=async()=>{const f=bgInput.files[0];if(!f)return;bgUrl=await readFile(f);bgImage.src=bgUrl;bgImage.style.display='block';empty.style.display='none';msg('背景を設定したよ！');bgInput.value=''};
document.getElementById('clearBg').onclick=()=>{bgUrl=null;bgImage.removeAttribute('src');bgImage.style.display='none';empty.style.display=items.length?'none':'grid';msg('背景をリセットしたよ')};
photosInput.onchange=async()=>{const files=[...photosInput.files];for(const file of files){if(!file.type.startsWith('image/'))continue;const src=await readFile(file);addPhoto(src)}photosInput.value='';updateEmpty();msg(files.length+'枚の写真を追加したよ！')};
function addPhoto(src){const el=document.createElement('div');el.className='photo';const img=document.createElement('img');img.src=src;img.alt='選んだ写真';el.appendChild(img);stage.appendChild(el);
 const s=Math.min(130,stage.clientWidth*.34);const item={id:nextId++,el,src,x:stage.clientWidth/2-s/2+(items.length%3-1)*18,y:stage.clientHeight/2-s/2+(items.length%4-1)*18,size:s};items.push(item);paint(item);el.addEventListener('pointerdown',e=>startDrag(e,item));el.addEventListener('click',e=>{e.stopPropagation();select(item)});select(item)}
function paint(it){it.el.style.width=it.size+'px';it.el.style.height=it.size+'px';it.el.style.left=it.x+'px';it.el.style.top=it.y+'px'}
let drag=null;
function startDrag(e,it){e.preventDefault();select(it);drag={it,startX:e.clientX,startY:e.clientY,x:it.x,y:it.y};it.el.setPointerCapture(e.pointerId);it.el.onpointermove=ev=>{if(!drag||drag.it!==it)return;it.x=Math.max(0,Math.min(stage.clientWidth-it.size,drag.x+ev.clientX-drag.startX));it.y=Math.max(0,Math.min(stage.clientHeight-it.size,drag.y+ev.clientY-drag.startY));paint(it)};it.el.onpointerup=()=>{drag=null;it.el.onpointermove=null;it.el.onpointerup=null}}
stage.addEventListener('click',()=>select(null));
function select(it){selected=it;items.forEach(x=>x.el.classList.toggle('selected',x===it));['smaller','bigger','delete'].forEach(id=>document.getElementById(id).disabled=!it);document.getElementById('sizeControl').disabled=!it;if(it)document.getElementById('sizeControl').value=it.size}
document.getElementById('smaller').onclick=()=>resize(-16);
document.getElementById('bigger').onclick=()=>resize(16);
document.getElementById('sizeControl').oninput=e=>{if(selected){selected.size=+e.target.value;selected.x=Math.min(selected.x,stage.clientWidth-selected.size);selected.y=Math.min(selected.y,stage.clientHeight-selected.size);paint(selected)}};
function resize(d){if(!selected)return;selected.size=Math.max(64,Math.min(210,selected.size+d));selected.x=Math.min(selected.x,stage.clientWidth-selected.size);selected.y=Math.min(selected.y,stage.clientHeight-selected.size);paint(selected);document.getElementById('sizeControl').value=selected.size}
document.getElementById('delete').onclick=()=>{if(!selected)return;items=items.filter(x=>x!==selected);selected.el.remove();select(null);updateEmpty();msg('写真を削除したよ')};
function updateEmpty(){empty.style.display=items.length||bgUrl?'none':'grid'}
document.getElementById('save').onclick=async()=>{
 try{msg('画像を作成中…');const scale=3,w=stage.clientWidth,h=stage.clientHeight,c=document.createElement('canvas');c.width=w*scale;c.height=h*scale;const ctx=c.getContext('2d');ctx.scale(scale,scale);
 if(bgUrl){const im=await loadImage(bgUrl);cover(ctx,im,w,h)}else{const g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#b7d5ff');g.addColorStop(.55,'#ffdce8');g.addColorStop(1,'#ffebbd');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
 for(const it of items){const im=await loadImage(it.src);ctx.save();ctx.beginPath();ctx.arc(it.x+it.size/2,it.y+it.size/2,it.size/2-1.5,0,Math.PI*2);ctx.clip();cover(ctx,im,it.size,it.size,it.x,it.y);ctx.restore();ctx.beginPath();ctx.arc(it.x+it.size/2,it.y+it.size/2,it.size/2-1.5,0,Math.PI*2);ctx.strokeStyle='white';ctx.lineWidth=3;ctx.stroke()}
 c.toBlob(async blob=>{if(!blob){msg('画像を作れなかったよ。もう一度試してね');return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='maru-photo.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);msg('画像を作成したよ！ iPhoneのダウンロードや共有メニューを確認してね。')},'image/png');
 }catch(e){msg('保存に失敗したよ。写真を選び直して試してね。')}
};
function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
function cover(ctx,im,w,h,x=0,y=0){const r=Math.max(w/im.width,h/im.height),sw=w/r,sh=h/r,sx=(im.width-sw)/2,sy=(im.height-sh)/2;ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}
window.addEventListener('resize',()=>items.forEach(p=>{p.x=Math.min(p.x,stage.clientWidth-p.size);p.y=Math.min(p.y,stage.clientHeight-p.size);paint(p)}));
</script>
</body>
</html>
